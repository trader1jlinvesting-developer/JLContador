<ion-header>
  <ion-toolbar color="success" >
    <ion-icon name="star" slot="start"></ion-icon>
    <ion-buttons slot="start">
      <ion-menu-button color="dark" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>JLContador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-grid>
    <ion-row  >
      <ion-col  size="6">
        <ion-card color="success">
          <ion-card-header>
            <ion-card-title>$ 30.000</ion-card-title>
            <ion-card-subtitle>Ingresos Mes</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
      <ion-col  size="6">
        <ion-card color="light">
          <ion-card-header>
            <ion-card-title>$ 10.000</ion-card-title>
            <ion-card-subtitle>Gastos Mes</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        Ingresos vs Gastos Mensual
      </ion-card-header>
      <ion-card-content>
        <canvas #barCanvas style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        Historico Ingresos vs Gastos Del Mes
      </ion-card-header>
      <ion-card-content>
        <canvas #lineCanvasDia style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        Historico cuentas por Status
      </ion-card-header>
      <ion-card-content>
        <canvas #lineCanvas style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

    </div>




</ion-content>
