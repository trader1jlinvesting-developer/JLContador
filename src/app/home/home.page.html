<ion-header>
  <ion-toolbar color="success">
    <ion-icon name="star" slot="start"></ion-icon>
    <ion-buttons slot="start">
      <ion-menu-button color="dark" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>JLInvesting</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>


  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-label>Mes</ion-label>
          <ion-select [(ngModel)]="filtroMes" (ionChange)="aplicarFiltros()">
            <ion-select-option *ngFor="let m of mesesLista" [value]="m.valor">
              {{ m.nombre }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>

      <ion-col size="6">
        <ion-item>
          <ion-label>Año</ion-label>
          <ion-select [(ngModel)]="filtroAnio" (ionChange)="aplicarFiltros()">
            <ion-select-option *ngFor="let a of aniosLista" [value]="a">
              {{ a }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card>
    <ion-card-header>
      Historico Movimientos Por Mes
    </ion-card-header>
    <ion-card-content>
      <canvas #lineCanvas class="chart-canvas"></canvas>
    </ion-card-content>
  </ion-card>


  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let item of totalesTipos">
        <ion-card [style.backgroundColor]="coloresTipos[item.tipo]">
          <ion-card-header>
            <ion-card-title>$ {{ item.valor | number:'1.0-0' }}</ion-card-title>
            <ion-card-subtitle>{{ item.tipo }} Mes</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>



  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        Movimientos Del Mensual
      </ion-card-header>
      <ion-card-content>
         <canvas #barCanvas class="chart-canvas"></canvas>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        Historico Movimientos Del Mes
      </ion-card-header>
      <ion-card-content>
         <canvas #lineCanvasDia class="chart-canvas"></canvas>
      </ion-card-content>
    </ion-card>

  </div>


</ion-content>
