<ion-header>
  <ion-toolbar color="success">
    <ion-icon name="star" slot="start"></ion-icon>
    <ion-buttons slot="start">
      <ion-menu-button color="dark" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>JLContador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let item of totalesTipos">
        <ion-card [style.backgroundColor]="coloresTipos[item.tipo]">
          <ion-card-header>
            <ion-card-title>$ {{ item.valor | number:'1.0-0' }}</ion-card-title>
            <ion-card-subtitle>{{ item.tipo }} Mes</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>



  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        Movimientos Del Mensual
      </ion-card-header>
      <ion-card-content>
        <canvas #barCanvas style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        Historico Movimientos Del Mes
      </ion-card-header>
      <ion-card-content>
        <canvas #lineCanvasDia style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        Historico Movimientos Por Mes
      </ion-card-header>
      <ion-card-content>
        <canvas #lineCanvas style="position: relative; height:20vh; width:40vw"></canvas>
      </ion-card-content>
    </ion-card>

  </div>




</ion-content>
