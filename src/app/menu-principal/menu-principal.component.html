
<ion-menu side="start" menuId="menuPrincipal" contentId="main">
  <ion-header>
    <ion-toolbar color="warning" >
      <ion-title>Menu Principal</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
 
    <ion-list [inset]="true">

    <ion-item [button]="true" routerLink="/home"   >
      <ion-icon  slot="start" ></ion-icon>
      <ion-label>Inicio</ion-label>      
    </ion-item>
     
    <ion-item [button]="true"   >
      <ion-icon color="danger" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Cuentas</ion-label>
      <ion-note slot="end">1</ion-note>
    </ion-item>

    <ion-item [button]="true">
      <ion-icon color="tertiary" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Operativas</ion-label>
      <ion-note slot="end">2</ion-note>
    </ion-item>
    
    <ion-item [button]="true"  routerLink="/movimientos"  >
      <ion-icon color="success" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Movimientos</ion-label>
      <ion-note slot="end">1</ion-note>
    </ion-item>

    <ion-item [button]="true">
      <ion-icon color="warning" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Maestros</ion-label>
      <ion-note slot="end">4</ion-note>
    </ion-item>
    <ion-item [button]="true">
      <ion-icon color="warning" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Cuentas Por Empresa</ion-label>
      <ion-note slot="end">4.1</ion-note>
    </ion-item>
    <br>
    <ion-item [button]="true" routerLink="/login"   >
      <ion-icon  slot="start" ></ion-icon>
      <ion-label>Salir</ion-label>      
    </ion-item>

  </ion-list>

  </ion-content>
</ion-menu>
