<div class="login-container">




  <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">


      <!-- Logo -->
  <div class="logo-container">
    <img src="../../../assets/img/JLInvesting.jpg" alt="Logo Empresa" class="logo-empresa" />
  </div>

  <!-- Inputs -->

  <p>Usuario / Email</p>
  <div class="input-wrapper">
    <span class="input-emoji">👤</span>
    <input type="email" formControlName="email" class="input-login" placeholder="Correo electrónico" />
  </div>

  <p>Contraseña</p>
  <div class="input-wrapper">
    <span class="input-emoji">🔒</span>
    <input type="password" formControlName="password" class="input-login" placeholder="Contraseña" />
  </div>

  <div style="margin-top: 20px;">
    <button class="btn-login" type="submit">Iniciar sesión</button>
  </div>

  <div class="ion-text-center ion-margin-top">
    <a (click)="irARegistro()">¿No tienes cuenta? Regístrate</a>
  </div>
  <br>

</form>

<br>
<br>

  <!-- Footer -->
  <div class="footer-derecha">
    Create by JLInvesting - 2024
  </div>

</div>
