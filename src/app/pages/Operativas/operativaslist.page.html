<!-- src/app/pages/operativas/operativaslist.page.html -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Operativas</ion-title>   
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="operativas$ | async as operativas; else noData">
    <ion-list>
      <ion-item-sliding *ngFor="let o of operativas">
        <ion-item>
          <ion-label>
            <h2>{{ o.numOperativa || o.numOperativa || 'N/A' }}</h2>
            <p>Fecha: {{ formatFecha(o.fecha || o.fecha) }}</p>
            <p>Activo: {{ o.activo || o.activo }}</p>
            <p>Resultado: {{ o.resultado || o.resultado }}</p>
            <p><strong>Balance:</strong> {{ o.balanceActual || o.balanceActual }}</p>
          </ion-label>

          <ion-buttons slot="end">
            <ion-button fill="clear" (click)="editar(o.id ?? o['id'])">
              <ion-icon name="create-outline"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="confirmarEliminar(o.id ?? o['id'])">
              <ion-icon name="trash-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option (click)="editar(o.id ?? o['id'])">Editar</ion-item-option>
          <ion-item-option color="danger" (click)="confirmarEliminar(o.id ?? o['id'])">Eliminar</ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>
  </ng-container>

  <!-- Botón flotante -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="success" (click)="irCrear()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ng-template #noData>
    <ion-text color="medium">
      <p class="ion-text-center">No hay operativas registradas.</p>
    </ion-text>
  </ng-template>
</ion-content>
