<div class="filtros-container" style="padding: 16px;">
  <div class="row">
    <!-- Filtro Mes -->
    <div class="col-6">
      <label for="mesSelect">Mes</label>
      <select
        id="mesSelect"
        [(ngModel)]="filtroMes"
        (change)="aplicarFiltros()"
        class="form-select"
      >
        <option *ngFor="let m of mesesLista" [value]="m.valor">
          {{ m.nombre }}
        </option>
      </select>
    </div>

    <!-- Filtro Año -->
    <div class="col-6">
      <label for="anioSelect">Año</label>
      <select
        id="anioSelect"
        [(ngModel)]="filtroAnio"
        (change)="aplicarFiltros()"
        class="form-select"
      >
        <option *ngFor="let a of aniosLista" [value]="a">
          {{ a }}
        </option>
      </select>
    </div>
  </div>
</div>

<div class="ion-padding">
 
  <ion-card    >
      <ion-card-header>

            <ion-card-subtitle>{{ item.tipo }} Mes</ion-card-subtitle>

        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
