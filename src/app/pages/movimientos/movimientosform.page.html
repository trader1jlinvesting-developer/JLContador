<!-- src/app/pages/movimientos/movimientos-form.page.html -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/movimientos"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear / Editar Movimiento</ion-title>
  </ion-toolbar>
</ion-header>

    <ion-content [fullscreen]="true" class="ion-padding">
    <form [formGroup]="form" (ngSubmit)="guardar()">
    
    <ion-item>
    <ion-label>Fecha Movimiento</ion-label>
    <ion-datetime-button datetime="FechaMovimiento"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
            <ng-template>
            <ion-datetime
                id="FechaMovimiento"
                presentation="date"
                (ionChange)="form.get('FechaMovimiento')?.setValue($event.detail.value)">
            </ion-datetime>
            </ng-template>
        </ion-modal>
    </ion-item>

 <!-- Tipo Movimiento -->
<ion-item>
  <ion-select
    formControlName="IdTipo"
    label="Tipo Movimiento"
    interface="popover"
    placeholder="Seleccione"
    (ionChange)="onTipoChange($event)" >
    <ion-select-option *ngFor="let tipo of tipos" [value]="tipo.id">
    {{ tipo.label }}
  </ion-select-option>
  </ion-select>
</ion-item>

 <!-- Concepto -->
<ion-item>
  <ion-select
    formControlName="IdConcepto"
    label="Concepto"
    interface="popover"
    placeholder="Seleccione"
    (ionChange)="onConceptoChange($event)"
  >
    <ion-select-option *ngFor="let c of conceptos" [value]="c.id">
      {{ c.label }}
    </ion-select-option>
  </ion-select>
</ion-item>


    <ion-item>
      <ion-label position="stacked">Valor</ion-label>
      <ion-input type="number" formControlName="Valor"></ion-input>
    </ion-item>

 <!-- Moneda (guarda directamente el texto en el form) -->
<ion-item>
  <ion-select
    formControlName="Moneda"
    label="Moneda"
    interface="popover"
    placeholder="Seleccione"
  >
    <ion-select-option *ngFor="let m of monedas" [value]="m.value">
      {{ m.label }}
    </ion-select-option>
  </ion-select>
</ion-item>

    <ion-item>
      <ion-label position="stacked">Cantidad</ion-label>
      <ion-input type="number" formControlName="Cantidad"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Total</ion-label>
      <ion-input type="number" formControlName="Total" readonly></ion-input>
    </ion-item>

     <!-- Moneda (guarda directamente el texto en el form) -->
    <ion-item>
      <ion-select
        formControlName="Empresa"
        label="Empresa"
        interface="popover"
        placeholder="Seleccione"
      >
        <ion-select-option *ngFor="let em of empresas" [value]="em.value">
          {{ em.label }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Número de cuenta</ion-label>
      <ion-input formControlName="NumeroCuenta"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Documento Relacionado</ion-label>
      <ion-input formControlName="DocumentoRelacionado"></ion-input>
    </ion-item>

     <ion-item>
      <ion-label position="stacked">Responsable</ion-label>
      <ion-input formControlName="Responsable"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Nota</ion-label>
      <ion-input formControlName="Nota"></ion-input>
    </ion-item>



    <ion-button expand="block" type="submit" color="success" class="ion-margin-top">Guardar</ion-button>
  </form>
</ion-content>
